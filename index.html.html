<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function calcular() {
            valor1 = Number(document.getElementById('1').value)
            valor2 = Number(document.getElementById('2').value)

            soma = valor1 + valor2;
            subtracao = valor1 - valor2;
            multiplicacao = valor1 * valor2;
            divisao = valor1 / valor2;

            alert("soma: " + soma + " - subtração: " + subtracao + " - multiplicação: " + multiplicacao + " - divisão: " + divisao)
        }
    </script>
</head>
<body>
    <input type="number" id="1" placeholder="Insira o primeiro valor aqui!">
    <input type="number" id="2" placeholder="Insira o segundo valor aqui!">
    <input type="button" value="CALCULAR" onclick="calcular()">
</body>
</html>
